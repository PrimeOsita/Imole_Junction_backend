        - adminJwt: []
      responses:
        '200':
          description: Admins
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  admins:
                    type: array
                    items:
                      $ref: '#/components/schemas/Admin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Admin - Auth & Accounts
      summary: Create an admin account (super admin only)
      description: '`content_manager` can manage challenges and translations. `super_admin` can also see analytics and manage
        admins. Share the temporary password with the person, who should change it via PATCH /admin/me/password.'
      security:
        - adminJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
                - role
              properties:
                name:
                  type: string
                  example: Product Manager
                email:
                  type: string
                  example: pm@example.com
                password:
                  type: string
                  minLength: 8
                role:
                  type: string
                  enum:
                    - content_manager
                    - super_admin
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  admin:
                    $ref: '#/components/schemas/Admin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/admins/{id}:
    patch:
      tags:
        - Admin - Auth & Accounts
      summary: Change an admin's role, deactivate them, or reset their password (super admin only)
      description: 'Send `isActive: false` to lock someone out immediately. You cannot change your own account here.'
      security:
        - adminJwt: []
      parameters:
        - name: id
          in: path
          required: true
          description: Admin ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: At least one field is required
              properties:
                role:
                  type: string
                  enum:
                    - content_manager
                    - super_admin
                isActive:
                  type: boolean
                password:
                  type: string
                  minLength: 8
                  description: Sets a new password
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  admin:
                    $ref: '#/components/schemas/Admin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/challenges:
    get:
      tags:
        - Admin - Challenges
      summary: List challenges
      description: Any admin. Includes correct answers.
      security:
        - adminJwt: []
      parameters:
        - name: skillId
          in: query
          schema:
            type: string
        - name: difficulty
          in: query
          schema:
            type: string
            enum:
              - easy
              - medium
              - hard
        - name: isActive
          in: query
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: A page of challenges
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Challenge'
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Admin - Challenges
      summary: Create a challenge
      security:
        - adminJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - skillId
                - type
                - difficulty
                - translations
              properties:
                skillId:
                  type: string
                  example: 65f1c2a9b3d4e5f6a7b8c9d0
                  description: Get IDs from GET /skills
                type:
                  type: string
                  enum:
                    - text
                    - multiple_choice
                difficulty:
                  type: string
                  enum:
                    - easy
                    - medium
                    - hard
                isActive:
                  type: boolean
                  default: true
                translations:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/Translation'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  challenge:
                    $ref: '#/components/schemas/Challenge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/challenges/{id}:
    get:
      tags:
        - Admin - Challenges
      summary: Get one challenge
      security:
        - adminJwt: []
      parameters:
        - name: id
          in: path
          required: true
