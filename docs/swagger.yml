    get:
      tags:
        - Admin - Analytics
      summary: Start a CSV export (super admin only)
      description: Runs in the background. Use the returned jobId with GET /admin/analytics/export/{jobId}.
      security:
        - adminJwt: []
      responses:
        '202':
          description: Export started
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  jobId:
                    type: string
                    example: '1'
