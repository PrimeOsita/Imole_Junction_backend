          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/analytics/export/{jobId}:
    get:
      tags:
        - Admin - Analytics
      summary: Download the CSV once it is ready (super admin only)
      description: While the job is still running, returns its state as JSON. Once completed, returns the CSV file.
      security:
        - adminJwt: []
      parameters:
        - name: jobId
          in: path
          required: true
          description: Job ID from the previous call
          schema:
            type: string
      responses:
        '200':
          description: The CSV (when completed) or the job state (while running)
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  state:
                    type: string
                    example: active
