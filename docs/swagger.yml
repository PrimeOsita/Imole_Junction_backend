openapi: 3.0.3
info:
  title: IMOLE API
  version: 1.0.0
  description: 'Backend for IMOLE, a gamified life-skills platform for Nigerian children aged 8-16.


    **Three kinds of user, three kinds of login. Use the Authorize button (top right) to set the token(s) you need:**

    - **childToken**: returned once by `POST /children`. Children have no password; this token is their credential.

    - **parentJwt**: returned by `POST /parents/register` or `POST /parents/login`.

    - **adminJwt**: returned by `POST /admin/login`.


    Every response has a `success` boolean. Errors look like `{ "success": false, "message": "..." }`.'
servers:
  - url: http://localhost:8000/api/v1
    description: Local development server
  - url: https://imole-junction-backend.onrender.com/api/v1
    description: Render production server
tags:
  - name: Skills
    description: The 5 life skills. Public, no token needed.
  - name: Child
    description: Everything a child does in the app. Uses the child token.
  - name: Parent
    description: Parent accounts, linking to a child, and progress views.
  - name: Admin - Auth & Accounts
    description: Admin login and managing admin accounts.
  - name: Admin - Challenges
    description: Challenge library and Yoruba/Pidgin translations.
  - name: Admin - Analytics
    description: Platform metrics and CSV export (super admin only).
components:
  securitySchemes:
    childToken:
      type: http
      scheme: bearer
      description: Opaque token returned by POST /children. Paste only the token.
    parentJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Invalid input (missing or wrong fields, bad ID, etc.)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, invalid or expired token, or wrong credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated, but not allowed to do this
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested record does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The request conflicts with the current state (duplicate, already done, limit reached)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limit hit, try again later
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Something went wrong
    Child:
      type: object
      properties:
        _id:
          type: string
          example: 65f1c2a9b3d4e5f6a7b8c9d0
        name:
          type: string
          example: Ada
        age:
          type: integer
          minimum: 8
          maximum: 16
          example: 10
        preferredLanguage:
          type: string
          enum:
            - en
            - yo
            - pcm
        anonymousUsername:
          type: string
          example: SwiftLeopard482
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ChildSummary:
      type: object
      properties:
        _id:
          type: string
          example: 65f1c2a9b3d4e5f6a7b8c9d0
        name:
          type: string
          example: Ada
        anonymousUsername:
          type: string
          example: SwiftLeopard482
        age:
          type: integer
          example: 10
    Skill:
      type: object
      properties:
        _id:
          type: string
          example: 65f1c2a9b3d4e5f6a7b8c9d0
        slug:
          type: string
          enum:
            - mental_math
            - persuasive_speaking
            - financial_literacy
            - creative_problem_solving
            - emotional_intelligence
        name:
          type: string
          example: Mental Math
    Translation:
      type: object
      required:
        - language
        - prompt
      properties:
        language:
          type: string
          enum:
            - en
            - yo
            - pcm
        prompt:
          type: string
          example: What is 12 + 15?
        options:
          type: array
          items:
            type: string
          description: Only for multiple_choice challenges
          example:
            - '25'
            - '27'
            - '29'
            - '31'
        correctAnswer:
          type: string
          description: Only for multiple_choice challenges
          example: '27'
    Challenge:
      type: object
      properties:
        _id:
          type: string
          example: 65f1c2a9b3d4e5f6a7b8c9d0
        skillId:
          type: string
          example: 65f1c2a9b3d4e5f6a7b8c9d0
        type:
          type: string
          enum:
            - text
            - multiple_choice
        difficulty:
          type: string
          enum:
            - easy
            - medium
            - hard
        isActive:
          type: boolean
        createdBy:
          type: string
          example: 65f1c2a9b3d4e5f6a7b8c9d0
        translations:
          type: array
          items:
            $ref: '#/components/schemas/Translation'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TodayChallenge:
      type: object
      properties:
        success:
          type: boolean
          example: true
        assignmentId:
          type: string
          example: 65f1c2a9b3d4e5f6a7b8c9d0
        locked:
          type: boolean
          description: true once the child has submitted today
        swapsRemaining:
          type: integer
          example: 2
        completedAt:
          type: string
          format: date-time
          nullable: true
        challenge:
          type: object
          description: One language only, and never includes the correct answer
          properties:
            id:
              type: string
              example: 65f1c2a9b3d4e5f6a7b8c9d0
            skillId:
              type: string
              example: 65f1c2a9b3d4e5f6a7b8c9d0
            type:
              type: string
              enum:
                - text
                - multiple_choice
            difficulty:
              type: string
              enum:
                - easy
                - medium
                - hard
            language:
              type: string
              enum:
                - en
                - yo
                - pcm
            prompt:
              type: string
            options:
              type: array
              items:
                type: string
              description: Empty for text challenges
    Streak:
      type: object
      properties:
        _id:
          type: string
          example: 65f1c2a9b3d4e5f6a7b8c9d0
        childId:
          type: string
          example: 65f1c2a9b3d4e5f6a7b8c9d0
        currentStreak:
          type: integer
          example: 3
        bestStreak:
          type: integer
          example: 5
        lastActiveDate:
          type: string
          format: date-time
          nullable: true
    Feedback:
      type: object
      properties:
        encouragement:
          type: string
          example: Great job, you got it!
        educationalTip:
          type: string
          nullable: true
          example: 'Tip: breaking a big number into smaller parts makes mental math faster.'
        skillFeedback:
          type: string
          example: This was a Mental Math challenge. Every one you complete builds that skill.
    SubmitResult:
      type: object
      properties:
        success:
          type: boolean
          example: true
        submission:
          type: object
          properties:
            _id:
              type: string
              example: 65f1c2a9b3d4e5f6a7b8c9d0
            dailyAssignmentId:
              type: string
              example: 65f1c2a9b3d4e5f6a7b8c9d0
            childId:
              type: string
              example: 65f1c2a9b3d4e5f6a7b8c9d0
            responseText:
              type: string
            selectedOption:
              type: string
            isCorrect:
              type: boolean
              nullable: true
            submittedAt:
              type: string
              format: date-time
        isCorrect:
          type: boolean
          nullable: true
          description: null for text challenges (not auto-graded)
        pointsEarned:
          type: integer
          description: 10 if correct, 5 otherwise
          example: 10
        correctAnswer:
          type: string
          nullable: true
          description: null for text challenges
        streak:
          $ref: '#/components/schemas/Streak'
        feedback:
          $ref: '#/components/schemas/Feedback'
    SkillScore:
      type: object
      properties:
        skill:
          $ref: '#/components/schemas/Skill'
        score:
          type: integer
          example: 40
        challengesCompleted:
          type: integer
          example: 6
    LeaderboardRow:
      type: object
      properties:
        rank:
          type: integer
          example: 1
        anonymousUsername:
          type: string
          example: SwiftLeopard482
        points:
          type: integer
          example: 120
        currentStreak:
          type: integer
          example: 4
    Certificate:
      type: object
      properties:
        _id:
          type: string
          example: 65f1c2a9b3d4e5f6a7b8c9d0
        childId:
          type: string
          example: 65f1c2a9b3d4e5f6a7b8c9d0
        skillId:
          $ref: '#/components/schemas/Skill'
        title:
          type: string
          example: Mental Math Champion
        issuedAt:
          type: string
          format: date-time
        fileUrl:
          type: string
          nullable: true
          description: Not generated yet; the frontend renders the certificate from this data
    Admin:
      type: object
      properties:
        id:
          type: string
          example: 65f1c2a9b3d4e5f6a7b8c9d0
        name:
          type: string
          example: Product Manager
        email:
          type: string
          example: pm@example.com
        role:
          type: string
          enum:
            - content_manager
            - super_admin
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
    Metrics:
      type: object
      properties:
        totalChildren:
          type: integer
        dau:
          type: integer
          description: Children who submitted today
        mau:
          type: integer
          description: Children who submitted in the last 30 days
        todayAssignments:
          type: integer
        todayCompletions:
          type: integer
        completionRate:
          type: number
          example: 0.75
        averageCurrentStreak:
          type: number
        longestStreak:
          type: integer
paths:
  /skills:
    get:
      tags:
        - Skills
      summary: List all skills
      responses:
        '200':
          description: The 5 skills
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  skills:
                    type: array
                    items:
                      $ref: '#/components/schemas/Skill'
  /skills/{id}:
    get:
      tags:
        - Skills
      summary: Get one skill by ID
      parameters:
        - name: id
          in: path
          required: true
          description: Skill ID
          schema:
            type: string
      responses:
        '200':
          description: The skill
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  skill:
                    $ref: '#/components/schemas/Skill'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /children:
    post:
      tags:
        - Child
      summary: Create a child profile (onboarding)
      description: No login needed. Returns a token ONCE. The app must store it and send it as a Bearer token on every other
        child request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - age
              properties:
                name:
                  type: string
                  example: Ada
                age:
                  type: integer
                  minimum: 8
                  maximum: 16
                  example: 10
                preferredLanguage:
                  type: string
                  enum:
                    - en
                    - yo
                    - pcm
                  default: en
      responses:
        '201':
          description: Profile created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  childId:
                    type: string
                    example: 65f1c2a9b3d4e5f6a7b8c9d0
                  anonymousUsername:
                    type: string
                    example: SwiftLeopard482
                  token:
                    type: string
                    description: Shown only this once
        '400':
          $ref: '#/components/responses/BadRequest'
  /children/me:
    get:
      tags:
        - Child
      summary: Get my profile
      security:
        - childToken: []
      responses:
        '200':
          description: My profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  child:
                    $ref: '#/components/schemas/Child'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Child
      summary: Update my name or language
      security:
        - childToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                preferredLanguage:
                  type: string
                  enum:
                    - en
                    - yo
                    - pcm
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  child:
                    $ref: '#/components/schemas/Child'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /children/me/challenge/today:
    get:
      tags:
        - Child
      summary: Get today's challenge
      description: 'Creates today''s challenge on first call and returns the same one for the rest of the day. The prompt
        is in the child''s language (English if no translation exists). `type` tells the app what to show: option buttons
        for `multiple_choice`, a text box for `text`.'
      security:
        - childToken: []
      responses:
        '200':
          description: Today's challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayChallenge'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /children/me/challenge/today/submit:
    post:
      tags:
        - Child
      summary: Submit an answer to today's challenge
      description: Send `selectedOption` for multiple_choice challenges, or `responseText` for text challenges. One submission
        per day. Text challenges are not auto-graded, so `isCorrect` and `correctAnswer` come back null.
      security:
        - childToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                selectedOption:
                  type: string
                  example: '27'
                  description: Exact text of one of the options
                responseText:
                  type: string
                  maxLength: 2000
                  example: Reading helps you learn new words.
      responses:
        '200':
          description: Result, points, streak and feedback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /children/me/challenge/today/swap:
    post:
      tags:
        - Child
      summary: Swap today's challenge for another one of the same skill
      description: Only before answering, and at most 2 swaps per day. Returns the new challenge in the same shape as GET
        /children/me/challenge/today.
      security:
        - childToken: []
      responses:
        '200':
          description: The new challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayChallenge'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /children/me/streak:
    get:
      tags:
        - Child
      summary: Get my streak
      security:
        - childToken: []
      responses:
        '200':
          description: Streak
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  currentStreak:
                    type: integer
                  bestStreak:
                    type: integer
                  lastActiveDate:
                    type: string
                    format: date-time
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /children/me/progress:
    get:
      tags:
        - Child
      summary: Get my progress dashboard data
      security:
        - childToken: []
      responses:
        '200':
          description: Progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  totalCompleted:
                    type: integer
                  totalPoints:
                    type: integer
                  skills:
                    type: array
                    items:
                      $ref: '#/components/schemas/SkillScore'
                  recentSubmissions:
                    type: array
                    description: The 10 most recent
                    items:
                      type: object
                      properties:
                        submittedAt:
                          type: string
                          format: date-time
                        isCorrect:
                          type: boolean
                          nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /children/me/link-code:
    post:
      tags:
        - Child
      summary: Create a code a parent can use to link to this child
      description: The 6-character code expires after 10 minutes and works once.
      security:
        - childToken: []
      responses:
        '201':
          description: Link code
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  linkCode:
                    type: string
                    example: 7K3F9Q
                  expiresInSeconds:
                    type: integer
                    example: 600
        '401':
          $ref: '#/components/responses/Unauthorized'
  /leaderboard:
    get:
      tags:
        - Child
      summary: Anonymous leaderboard
      description: Top 50 plus my own row. Refreshed every 5 minutes.
      security:
        - childToken: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum:
              - weekly
              - all_time
            default: weekly
      responses:
        '200':
          description: Leaderboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  period:
                    type: string
                    enum:
                      - weekly
                      - all_time
                  top:
                    type: array
                    items:
                      $ref: '#/components/schemas/LeaderboardRow'
                  me:
                    allOf:
                      - $ref: '#/components/schemas/LeaderboardRow'
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /parents/register:
    post:
      tags:
        - Parent
      summary: Register a parent account
      description: Provide an email, a phone number, or both.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - password
              properties:
                name:
                  type: string
                  example: Mrs Okafor
                email:
                  type: string
                  example: parent@example.com
                phone:
                  type: string
                  example: 08012345678
                password:
                  type: string
                  minLength: 8
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  parent:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 65f1c2a9b3d4e5f6a7b8c9d0
                      name:
                        type: string
                      email:
                        type: string
                      phone:
                        type: string
                  token:
                    type: string
                    description: Use as parentJwt
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /parents/login:
    post:
      tags:
        - Parent
      summary: Parent login
      description: Log in with email or phone, plus password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                email:
                  type: string
                phone:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  parent:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 65f1c2a9b3d4e5f6a7b8c9d0
                      name:
                        type: string
                  token:
                    type: string
                    description: Use as parentJwt
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /parents/link-child:
    post:
      tags:
        - Parent
      summary: Link a child using the code from the child's device
      security:
        - parentJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - linkCode
              properties:
                linkCode:
                  type: string
                  example: 7K3F9Q
      responses:
        '201':
          description: Linked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  child:
                    $ref: '#/components/schemas/ChildSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /parents/children:
    get:
      tags:
        - Parent
      summary: List my linked children
      security:
        - parentJwt: []
      responses:
        '200':
          description: Linked children
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  children:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChildSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /parents/children/{childId}/progress:
    get:
      tags:
        - Parent
      summary: View a linked child's progress
      security:
        - parentJwt: []
      parameters:
        - name: childId
          in: path
          required: true
          description: Child ID
          schema:
            type: string
      responses:
        '200':
          description: Progress summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  child:
                    $ref: '#/components/schemas/Child'
                  streak:
                    type: object
                    properties:
                      current:
                        type: integer
                      best:
                        type: integer
                  skills:
                    type: array
                    items:
                      $ref: '#/components/schemas/SkillScore'
                  certificatesEarned:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /parents/children/{childId}/share-card:
    get:
      tags:
        - Parent
      summary: Data for a shareable progress card
      description: Structured data only. The frontend turns it into a shareable image.
      security:
        - parentJwt: []
      parameters:
        - name: childId
          in: path
          required: true
          description: Child ID
          schema:
            type: string
      responses:
        '200':
          description: Share card data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  card:
                    type: object
                    properties:
                      name:
                        type: string
                      currentStreak:
                        type: integer
                      bestStreak:
                        type: integer
                      totalCompleted:
                        type: integer
                      totalPoints:
                        type: integer
                      topSkill:
                        type: string
                        nullable: true
                      certificatesEarned:
                        type: integer
                      generatedAt:
                        type: string
                        format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
