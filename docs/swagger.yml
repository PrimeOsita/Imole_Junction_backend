          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Admin - Challenges
      summary: Update a challenge
      description: To edit prompts or options, use the translations endpoints below.
      security:
        - adminJwt: []
      parameters:
        - name: id
