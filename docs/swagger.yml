      description: Limited to 10 attempts per 15 minutes per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: admin@imole.app
                password:
                  type: string
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  admin:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 65f1c2a9b3d4e5f6a7b8c9d0
                      name:
                        type: string
                      role:
                        type: string
                        enum:
                          - content_manager
                          - super_admin
                  token:
                    type: string
                    description: Use as adminJwt
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
